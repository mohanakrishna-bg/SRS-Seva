# SRS-Seva — Docker Compose for Development
#
# Usage:
#   docker compose up -d postgres     # Start only PostgreSQL
#   docker compose up                 # Start all services
#
# The backend and frontend can also be run outside Docker
# (using start.sh) while only PostgreSQL runs in a container.

services:
  # ─── PostgreSQL Database ───
  postgres:
    image: postgres:16-alpine
    container_name: seva-postgres
    environment:
      POSTGRES_DB: seva
      POSTGRES_USER: seva_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-seva_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seva_app -d seva"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── FastAPI Backend ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seva-backend
    environment:
      DATABASE_URL: postgresql://seva_app:${DB_PASSWORD:-seva_dev_password}@postgres:5432/seva
      SECRET_KEY: ${JWT_SECRET:-dev-secret-key-change-in-production}
      MODULE_FILTER: ""  # Empty = all modules
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    volumes:
      - ./backend/uploads:/app/uploads  # Persist uploaded photos
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  # ─── Vite Frontend Dev Server ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: seva-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
    driver: local
